name: E2E

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  # Live suites against a disposable Firefly III 6.6.2 in Docker.
  docker-e2e:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libsecret-1-dev libjsoncpp-dev libsqlite3-dev xvfb
      - name: Install pinned Flutter
        run: scripts/ci/install-flutter.sh
      - run: flutter pub get --enforce-lockfile
        working-directory: budget
      - name: Live E2E and Linux attachment round trip
        run: scripts/ci/firefly-e2e.sh host

  # Attachment round trip on an Android emulator against the Docker server.
  attachments-android:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install pinned Flutter
        run: scripts/ci/install-flutter.sh
      - run: flutter pub get --enforce-lockfile
        working-directory: budget
      - uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: scripts/ci/firefly-e2e.sh android

  # Attachment round trip on macOS and an iOS simulator (emulated server).
  attachments-apple:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    name: attachments-${{ matrix.target }}
    runs-on: macos-15
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        target: [macos, ios]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - if: matrix.target == 'macos'
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: scripts/ci/macos-entitlements.sh
      - name: Install pinned Flutter
        run: scripts/ci/install-flutter.sh
      - run: flutter pub get --enforce-lockfile
        working-directory: budget
      - name: Attachment round trip
        run: scripts/ci/attachments-smoke.sh "${{ matrix.target }}"
