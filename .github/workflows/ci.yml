name: CI

on: pull_request

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: budget
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install pinned Flutter
        run: |
          version="$(jq -er '.flutter' .fvmrc)"
          git clone --depth 1 --branch "$version" https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - run: flutter pub get --enforce-lockfile
      - name: Analyze app against baseline
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee "$RUNNER_TEMP/analyze.log"
          baseline="$(sed -n 's/^Analyzer issues: \([0-9][0-9]*\)$/\1/p' ../docs/plan/analyze-baseline.txt)"
          issues="$(sed -nE 's/^[[:space:]]*([0-9]+) issues? found.*/\1/p' "$RUNNER_TEMP/analyze.log")"
          if [[ -z "$issues" ]] && grep -q '^No issues found!' "$RUNNER_TEMP/analyze.log"; then
            issues=0
          fi
          test "$issues" -le "$baseline"
      - name: Analyze Firefly, platform, and test code
        run: |
          paths=(lib/firefly lib/platform test)
          if [[ -d integration_test ]]; then
            paths+=(integration_test)
          fi
          flutter analyze --fatal-infos --fatal-warnings "${paths[@]}"
      - name: Install SQLite for database tests
        run: |
          sudo apt-get update
          sudo apt-get install --yes libsqlite3-dev
      - run: flutter test --concurrency=2

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Scan Git history
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          release="https://github.com/gitleaks/gitleaks/releases/download/v$GITLEAKS_VERSION"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          cd "$RUNNER_TEMP"
          curl -fsSLO "$release/$archive"
          curl -fsSLO "$release/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          awk -v archive="$archive" '$2 == archive' "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "$archive" gitleaks
          cd "$GITHUB_WORKSPACE"
          "$RUNNER_TEMP/gitleaks" detect --no-banner --redact
